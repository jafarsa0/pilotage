name: docs-replay

# Docs that execute: replay every documented request and every conformance
# vector against the LIVE example server, on each push and once a week. A
# guide that drifts from the server, or a server that drifts from the spec,
# fails the build. This is what makes "replayed in CI" a fact, not a promise.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC: catch server drift even with no doc change
  workflow_dispatch:

jobs:
  guides:
    name: replay the guides against the live server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: replay documented requests
        run: node guides/check-guides.mjs

  conformance:
    name: run the conformance vectors against the live server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: conformance/harness/package-lock.json
      - run: npm ci
        working-directory: conformance/harness
      - run: node harness.mjs
        working-directory: conformance/harness
